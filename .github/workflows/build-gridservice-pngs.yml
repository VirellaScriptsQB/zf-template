name: Build Grid Service PNG Item Pack

on:
  push:
    branches:
      - civix-gridservice-item-images

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: civix-gridservice-item-images

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin zip

      - name: Convert SVG item icons to PNG
        run: |
          rm -rf gridservice-png-items
          mkdir -p gridservice-png-items
          for src in item-images/*.svg; do
            name="$(basename "$src" .svg)"
            rsvg-convert -w 256 -h 256 "$src" -o "gridservice-png-items/${name}.png"
          done
          zip -j -9 gridservice-item-images.zip gridservice-png-items/*.png

      - name: Commit PNG pack and ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridservice-png-items gridservice-item-images.zip
          git commit -m "Build real PNG Grid Service item pack [skip ci]" || exit 0
          git push origin HEAD:civix-gridservice-item-images
