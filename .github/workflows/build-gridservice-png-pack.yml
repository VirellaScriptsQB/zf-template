name: Build Grid Service PNG Pack

on:
  push:
    branches:
      - civix-gridservice-item-images

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick zip

      - name: Convert SVG item icons to PNG
        run: |
          set -e
          rm -rf gridservice-png-items
          mkdir -p gridservice-png-items
          for file in gridservice-item-images/*.svg; do
            name="$(basename "$file" .svg)"
            convert -background none -density 300 "$file" -resize 512x512 "gridservice-png-items/${name}.png"
          done
          cd gridservice-png-items
          zip -9 ../civix-gridservice-item-images-png.zip ./*.png
          cd ..

      - name: Commit PNG pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridservice-png-items civix-gridservice-item-images-png.zip
          git commit -m "Build Grid Service PNG item image ZIP"
          git push
